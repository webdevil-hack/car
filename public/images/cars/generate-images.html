<!DOCTYPE html>
<html>
<head>
    <title>Car Image Generator</title>
    <style>
        body { margin: 0; padding: 20px; background: #000; }
        .car-container { display: flex; flex-wrap: wrap; gap: 20px; }
        .car-card {
            width: 300px; height: 200px; background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            border-radius: 15px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
            border: 2px solid #00D4FF; box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
        }
        .car-icon { font-size: 60px; margin-bottom: 10px; }
        .car-name { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .car-price { font-size: 14px; color: #00D4FF; }
    </style>
</head>
<body>
    <div class="car-container">
        <div class="car-card">
            <div class="car-icon">🚗</div>
            <div class="car-name">BMW X5</div>
            <div class="car-price">$150/day</div>
        </div>
        <div class="car-card">
            <div class="car-icon">🚙</div>
            <div class="car-name">Tesla Model 3</div>
            <div class="car-price">$160/day</div>
        </div>
        <div class="car-card">
            <div class="car-icon">🚘</div>
            <div class="car-name">Mercedes C-Class</div>
            <div class="car-price">$140/day</div>
        </div>
        <div class="car-card">
            <div class="car-icon">🚔</div>
            <div class="car-name">Audi A4</div>
            <div class="car-price">$120/day</div>
        </div>
        <div class="car-card">
            <div class="car-icon">🚕</div>
            <div class="car-name">Porsche 911</div>
            <div class="car-price">$300/day</div>
        </div>
        <div class="car-card">
            <div class="car-icon">🚓</div>
            <div class="car-name">Lamborghini Huracán</div>
            <div class="car-price">$500/day</div>
        </div>
        <div class="car-card">
            <div class="car-icon">🚐</div>
            <div class="car-name">Range Rover</div>
            <div class="car-price">$200/day</div>
        </div>
        <div class="car-card">
            <div class="car-icon">🚑</div>
            <div class="car-name">Ferrari 488</div>
            <div class="car-price">$450/day</div>
        </div>
    </div>
</body>
</html>
